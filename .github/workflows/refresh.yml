name: Monthly refresh

on:
  schedule:
    # 7th of each month, 06:17 UTC — a few days after the registry's monthly update.
    - cron: '17 6 7 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Download Open Contracting Partnership exports
        run: |
          mkdir -p downloads
          base=https://data.open-contracting.org/en/publication
          curl -fL --retry 3 -o downloads/fts.csv.tar.gz "$base/41/download?name=full.csv.tar.gz"
          # Contracts Finder fills in end dates Find a Tender leaves blank.
          for y in $(seq 2021 "$(date +%Y)"); do
            curl -fL --retry 3 -o "downloads/cf_$y.csv.tar.gz" "$base/128/download?name=$y.csv.tar.gz" \
              || echo "Contracts Finder $y not available, skipping"
          done
          ls -lh downloads

      - name: Rebuild the dataset
        run: |
          python pipeline/tracker.py downloads/fts.csv.tar.gz \
            --contracts-finder downloads/cf_*.csv.tar.gz \
            --out data

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change in this month's export"
          else
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi
